services:
  pakodj-dev:
    build: .
    container_name: pakodj-dev
    restart: "no"
    env_file:
      - bot/.env
    environment:
      DATABASE_URL: postgres://pakodj:pakodj@db:5432/pakodj
      # Web API login happens via Discord OAuth (see Web API section in README);
      # put these in bot/.env to enable it (until then the endpoints return 503):
      # DISCORD_CLIENT_ID: your_discord_app_client_id
      # DISCORD_CLIENT_SECRET: your_discord_app_client_secret
      # API_PUBLIC_ORIGIN: https://api.yourdomain.com
      # Discord IDs that get the admin flag (comma separated)
      # DISCORD_ADMIN_IDS: 123456789012345678
      # Optional: browser origins allowed to call the API (comma separated)
      # API_CORS_ORIGINS: https://your-webapp.example
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./bot:/app
      - ./logs:/app/logs

  db:
    image: postgres:17-alpine
    container_name: pakodj-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pakodj
      POSTGRES_PASSWORD: pakodj
      POSTGRES_DB: pakodj
    volumes:
      - pakodj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakodj -d pakodj"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional (dev): same as deploy — expose http://pakodj-dev:8000 via tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pakodj-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      - pakodj-dev

volumes:
  pakodj-pgdata:
