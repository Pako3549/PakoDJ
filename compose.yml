services:
  pakodj-dev:
    build: .
    container_name: pakodj-dev
    # unless-stopped everywhere: a host (Raspberry Pi) reboot brings the
    # whole dev stack back without manual docker compose up.
    restart: unless-stopped
    env_file:
      - bot/.env
    environment:
      DATABASE_URL: postgres://pakodj:pakodj@db:5432/pakodj
      # API_PUBLIC_ORIGIN is NOT overridden here: bot/.env owns it (production
      # value arrives via the deploy workflow secrets rewrite).
      # Web API login happens via Discord OAuth (see Web API section in README);
      # put these in bot/.env to enable it (until then the endpoints return 503):
      # DISCORD_CLIENT_ID: your_discord_app_client_id
      # DISCORD_CLIENT_SECRET: your_discord_app_client_secret
      # API_PUBLIC_ORIGIN: https://api.yourdomain.com
      # Discord IDs that get the admin flag (comma separated)
      # DISCORD_ADMIN_IDS: 123456789012345678
      # Optional: browser origins allowed to call the API (comma separated).
      # Not needed when the webapp is served behind the local nginx (same origin).
      # API_CORS_ORIGINS: https://your-webapp.example
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./bot:/app
      - ./logs:/app/logs

  # Webapp (React + Vite + TypeScript): dev with hot reload on source mounts.
  web:
    build:
      context: ./web
      target: dev
    container_name: pakodj-web-dev
    restart: unless-stopped
    depends_on:
      - pakodj-dev
    volumes:
      - ./web:/app
      # Named volume so a fresh clone works out of the box: the first run
      # seeds it from the image's npm ci output (host node_modules can't
      # shadow what the bind mount would otherwise expose).
      - web-node-modules:/app/node_modules

  # Webserver in front of everything; the ONLY port published (dev only).
  # Open the whole frontend on: http://localhost:8080
  nginx:
    image: nginx:stable-alpine
    container_name: pakodj-nginx-dev
    restart: unless-stopped
    depends_on:
      - web
      - pakodj-dev
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Development exposure, as requested: nginx is the single entry point
      # (web UI, Vite assets/HMR, and the /api proxy). Production publishes
      # nothing and sits behind Cloudflare Tunnel instead.
      - "8080:80"

  db:
    image: postgres:17-alpine
    container_name: pakodj-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pakodj
      POSTGRES_PASSWORD: pakodj
      POSTGRES_DB: pakodj
    volumes:
      - pakodj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakodj -d pakodj"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pakodj-pgdata:
  web-node-modules:
