# PakoDJ production webserver: one origin routed through the Tunnel.
# /        -> static Vite build served by the web image (web:80)
# /api/*   -> bot FastAPI (pakodj:8000), internal-only service
# No ports are published: cloudflared maps the public hostname HERE (nginx:80).
# Docker's embedded DNS (127.0.0.11) is resolved at request time so container
# restarts never leave the proxy with a stale upstream IP.
server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Full result means the API routes keep their /api prefix
    # (the variables make proxy_pass resolve at request time).
    set $api "http://pakodj:8000";
    set $web "http://web:80";

    location /api/ {
        proxy_pass $api;
        # OAuth redirect flows may take a moment on first cold start
        proxy_read_timeout 120s;
    }

    # Clean URL for the invite-link builder (web/public/invite-link.html)
    location = /invite-link {
        return 301 /invite-link.html;
    }

    location / {
        proxy_pass $web;
    }
}
