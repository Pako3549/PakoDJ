# PakoDJ web UI dev webserver: one origin for the whole webapp.
# /        -> Vite dev server (web:3000)
# /api/*   -> bot FastAPI (pakodj-dev:8000), internal-only service
server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://pakodj-dev:8000;
        # OAuth redirect flows may take a moment on first cold start
        proxy_read_timeout 120s;
    }

    # Vite dev server assets + HMR websocket (upgrade headers) support;
    # the SPA fallback is served by Vite itself.
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
