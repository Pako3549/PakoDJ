# PakoDJ web UI dev webserver: one origin for the whole webapp.
# /        -> Vite dev server (web:3000)
# /api/*   -> bot FastAPI (pakodj-dev:8000), internal-only service
server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Docker's embedded DNS is resolved at request time (same technique as
    # prod.conf): a down/restarted bot or web container changes IP, and nginx
    # must follow instead of dialing a stale address until restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Full result means the API routes keep their /api prefix
    # (the variables make proxy_pass resolve at request time).
    set $api "http://pakodj-dev:8000";
    set $web "http://web:3000";

    location /api/ {
        proxy_pass $api;
        # OAuth redirect flows may take a moment on first cold start
        proxy_read_timeout 120s;
    }

    # Clean URL for the invite-link builder (web/public/invite-link.html)
    location = /invite-link {
        return 301 /invite-link.html;
    }

    # Vite dev server assets + HMR websocket (upgrade headers) support;
    # the SPA fallback is served by Vite itself.
    location / {
        proxy_pass $web;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
