name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEB_IMAGE_NAME: ${{ github.repository }}-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push bot Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push web Docker image
      uses: docker/build-push-action@v5
      with:
        context: web
        target: prod
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push nginx Docker image
      uses: docker/build-push-action@v5
      with:
        context: nginx
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare config files
      run: |
        mkdir -p bot logs
        cat > bot/.env <<EOF
        token=${{ secrets.DISCORD_TOKEN }}
        EOF
        if [ -n "${{ secrets.SPOTIFY_CLIENT_ID }}" ]; then
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" >> bot/.env
          echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> bot/.env
        fi
        # Web API: Discord OAuth login (only active together with API_PUBLIC_ORIGIN)
        echo "API_PUBLIC_ORIGIN=${{ secrets.API_PUBLIC_ORIGIN }}" >> bot/.env
        if [ -n "${{ secrets.DISCORD_CLIENT_ID }}" ]; then
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> bot/.env
          echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> bot/.env
        fi
        if [ -n "${{ secrets.DISCORD_ADMIN_IDS }}" ]; then
          echo "DISCORD_ADMIN_IDS=${{ secrets.DISCORD_ADMIN_IDS }}" >> bot/.env
        fi
        # Optional: Cloudflare Tunnel token (needed only with --profile tunnel)
        if [ -n "${{ secrets.TUNNEL_TOKEN }}" ]; then
          echo "TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}" >> .env
        fi

    - name: Pull and start containers
      run: |
        docker compose -f deploy/compose.yml pull
        docker compose -f deploy/compose.yml up -d --remove-orphans
