name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # GHCR requires lowercase repositories; compute the image names once
    # from the repository (native bash lowercase expansion).
    - name: Set lowercase image names
      id: names
      run: |
        echo "bot=${REGISTRY,,}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        echo "web=${REGISTRY,,}/${GITHUB_REPOSITORY,,}-web" >> "$GITHUB_OUTPUT"
        echo "nginx=${REGISTRY,,}/${GITHUB_REPOSITORY,,}-nginx" >> "$GITHUB_OUTPUT"
      env:
        REGISTRY: ghcr.io

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push bot Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.names.outputs.bot }}:latest
          ${{ steps.names.outputs.bot }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push web Docker image
      uses: docker/build-push-action@v5
      with:
        context: web
        target: prod
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.names.outputs.web }}:latest
          ${{ steps.names.outputs.web }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push nginx Docker image
      uses: docker/build-push-action@v5
      with:
        context: nginx
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ steps.names.outputs.nginx }}:latest
          ${{ steps.names.outputs.nginx }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare config files
      run: |
        mkdir -p bot logs
        cat > bot/.env <<EOF
        token=${{ secrets.DISCORD_TOKEN }}
        EOF
        if [ -n "${{ secrets.SPOTIFY_CLIENT_ID }}" ]; then
          echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" >> bot/.env
          echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> bot/.env
        fi
        # Web API: Discord OAuth login (only active together with API_PUBLIC_ORIGIN)
        echo "API_PUBLIC_ORIGIN=${{ secrets.API_PUBLIC_ORIGIN }}" >> bot/.env
        if [ -n "${{ secrets.DISCORD_CLIENT_ID }}" ]; then
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> bot/.env
          echo "DISCORD_CLIENT_SECRET=${{ secrets.DISCORD_CLIENT_SECRET }}" >> bot/.env
        fi
        if [ -n "${{ secrets.DISCORD_ADMIN_IDS }}" ]; then
          echo "DISCORD_ADMIN_IDS=${{ secrets.DISCORD_ADMIN_IDS }}" >> bot/.env
        fi
        # Optional: Cloudflare Tunnel token. compose interpolates ${TUNNEL_TOKEN}
        # from the project directory (deploy/), not from CWD: write accordingly.
        if [ -n "${{ secrets.TUNNEL_TOKEN }}" ]; then
          echo "TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}" >> deploy/.env
        fi

    - name: Pull and start containers
      run: |
        docker compose -f deploy/compose.yml pull
        # The tunnel profile is activated automatically when the token exists:
        # no secret -> no cloudflared service (nothing exposed by default).
        if [ -n "${{ secrets.TUNNEL_TOKEN }}" ]; then
          docker compose -f deploy/compose.yml --profile tunnel up -d --remove-orphans
        else
          docker compose -f deploy/compose.yml up -d --remove-orphans
        fi
