# Static SPA served inside the web image (target: prod). The outer nginx
# fronts this so / ends up behind the same origin as /api.
# Hashed build assets are immutable; the SPA fallback reloads index.html.
server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
