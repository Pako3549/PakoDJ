<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discord music bot control panel" />
    <title>PakoDJ</title>
    <script>
      // Theme resolution per docs/style.md: localStorage -> prefers-color-scheme -> dark.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body class="bg-surface text-primary font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
